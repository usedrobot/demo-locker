name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Merging two PRs seconds apart used to race their deploy jobs: both ran, and
# whichever finished last won — so the older tree could land on top of the
# newer one, with every check green and production quietly missing the change
# that had just been merged. Cancelling the superseded run means the newest
# commit is always the one that deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      # The npm tarball ships a prebuilt Worker, web app and D1 migrations. That
      # build only otherwise runs at release time, so a break in it would first
      # surface as a failed publish — run it on every PR instead. Its own guards
      # assert the worker bundle, the web entry document and the migration SQL.
      - run: bash packages/cli/scripts/build-assets.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test -w packages/api
      - run: npm test -w packages/web
      - run: npm test -w packages/player
      - run: npm test -w packages/cli

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/smoke.sh

  publish-image:
    needs: [check, test, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: standalone
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=standalone-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=standalone-${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/usedrobot/demo-locker,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    needs: publish-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/usedrobot/demo-locker:latest \
            -t ghcr.io/usedrobot/demo-locker:${{ github.sha }} \
            $(printf 'ghcr.io/usedrobot/demo-locker@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect ghcr.io/usedrobot/demo-locker:latest

  deploy-api:
    needs: [check, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build -w packages/player
      # Worker serves assets-first from packages/player/dist (wrangler.jsonc
      # assets.directory) — non-built assets like openapi.json must be copied
      # in here, mirroring the packages/api `deploy` script.
      - run: cp docs/openapi.json packages/player/dist/openapi.json
      # Apply D1 migrations before deploying. Drizzle selects every schema
      # column explicitly, so deploying code ahead of its migration breaks
      # all reads of the affected table — migrate first, always.
      - run: npx wrangler d1 migrations apply demo-locker-db --remote
        working-directory: packages/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler deploy
        working-directory: packages/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # The `demo-locker` Pages project now serves the brochure (site/), not the
  # app. There is no reference web deployment any more: the running instances
  # are the ones the wizard installs, which serve the web app from their own
  # Worker via the assets binding. deploy-api below still ships a reference API
  # Worker to exercise API changes against.
  #
  # Do not re-add a job that deploys packages/web to --project-name=demo-locker.
  # It would overwrite the brochure on the next push to main.
  deploy-site:
    needs: [check, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The site is static and needs no build — but wrangler has to resolve
      # against an installed workspace. Invoking it without this fails on a
      # peer conflict in the root package.json (`@demo-locker/api@undefined`),
      # which is why the old deploy-web appeared to work: it installed first.
      - run: npm install
      - run: npx wrangler pages deploy site --project-name=demo-locker --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
