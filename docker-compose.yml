services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: demolocker
      MINIO_ROOT_PASSWORD: demolocker
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: demos
      S3_ACCESS_KEY: demolocker
      S3_SECRET_KEY: demolocker
    depends_on:
      - minio

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  minio-data:
